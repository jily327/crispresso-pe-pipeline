name: Scientific regression and package checks
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.lock -r requirements-gui.lock
      - run: npm ci
        working-directory: frontend
      - run: npm test && npx tsc --noEmit
        working-directory: frontend
      - run: python viewer_build.py && python -m build --no-isolation
      - run: python -m pip install --no-deps dist/*.whl && python -m pip check
      - run: python -m pytest -q --junitxml=unit-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-and-test-results
          path: |
            unit-results.xml
            dist/
